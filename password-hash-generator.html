<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Password Hash Generator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui;max-width:520px;margin:40px auto;padding:16px;background:#f8fafc;color:#0f172a}
box{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
input,button{width:100%;padding:12px;margin:8px 0;font-size:15px;border-radius:8px;border:1px solid #cbd5e1;box-sizing:border-box}
button{background:#1A3D63;color:#fff;border:none;font-weight:700;cursor:pointer}
code{word-break:break-all;display:block;background:#f1f5f9;padding:12px;border-radius:8px;margin-top:8px}
.ok{color:#16a34a;font-size:13px}
</style></head><body>
<div class="box">
<h2>Super Admin Password Hash</h2>
<p>Strong password enter karo (12+ chars, letter, number, symbol). Hash copy kari Supabase SQL ma paste karo.</p>
<input type="password" id="pw" placeholder="New strong password">
<input type="password" id="pw2" placeholder="Confirm password">
<button onclick="go()">Generate Hash</button>
<p class="ok" id="msg"></p>
<code id="out">—</code>
</div>
<script>
const PEPPER = "VO-RM-v1-";
async function hashPassword(plain){
  const data = new TextEncoder().encode(PEPPER + plain);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function go(){
  const a = document.getElementById("pw").value;
  const b = document.getElementById("pw2").value;
  const msg = document.getElementById("msg");
  if(a !== b){ msg.textContent = "Passwords do not match"; return; }
  if(a.length < 12){ msg.textContent = "Min 12 characters"; return; }
  if(!/[a-zA-Z]/.test(a)||!/[0-9]/.test(a)||!/[^a-zA-Z0-9]/.test(a)){
    msg.textContent = "Need letter + number + symbol"; return;
  }
  const h = await hashPassword(a);
  document.getElementById("out").textContent = h;
  msg.textContent = "Hash ready — copy and run SQL UPDATE in Supabase";
  try{ await navigator.clipboard.writeText(h); msg.textContent += " (copied)"; }catch(e){}
}
</script>
</body></html>
