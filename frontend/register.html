<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Company | VO Recovery Manager</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
body.login-body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 45%,#2563eb 100%);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    padding:20px;
}
.login-card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:20px;
    padding:32px 28px 24px;
    box-shadow:0 25px 50px rgba(0,0,0,.35);
    text-align:center;
}
.login-logo{
    width:70px;
    height:70px;
    object-fit:contain;
    margin:0 auto 10px;
    border-radius:14px;
    background:#f8fafc;
    padding:6px;
    border:1px solid #e2e8f0;
}
.login-company{ font-size:16px; font-weight:700; color:#0f172a; margin:0 0 2px; }
.login-software{ font-size:12px; color:#64748b; margin:0 0 16px; }
.login-card h2{ margin:0 0 14px; color:#2563eb; font-size:20px; }
.login-card label{
    display:block;
    text-align:left;
    font-weight:600;
    color:#334155;
    margin:10px 0 5px;
    font-size:13px;
}
.login-card input, .login-card textarea{
    width:100%;
    padding:11px 13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:14px;
    box-sizing:border-box;
    outline:none;
    font-family:inherit;
}
.login-card input:focus, .login-card textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}
.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.btn-login{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}
.btn-login:hover{ background:#1d4ed8; }
.btn-login:disabled{ background:#94a3b8; cursor:not-allowed; }
.btn-secondary{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:none;
    border-radius:10px;
    background:#64748b;
    color:#fff;
    font-size:13px;
    cursor:pointer;
}
.btn-secondary:hover{ background:#475569; }
.section-title{
    text-align:left;
    font-size:13px;
    font-weight:700;
    color:#0f172a;
    margin:16px 0 4px;
    padding-bottom:4px;
    border-bottom:1px solid #e2e8f0;
}
.hint{ text-align:left; font-size:11px; color:#94a3b8; margin-top:3px; }
.login-footer{ margin-top:14px; font-size:12px; color:#94a3b8; }
#msgBox{ margin-top:10px; font-size:13px; text-align:left; white-space:pre-wrap; }
.msg-ok{ color:#16a34a; }
.msg-err{ color:#ef4444; }
@media (max-width:520px){
    .form-row{ grid-template-columns:1fr; }
}
</style>
</head>
<body class="login-body">

<div class="login-card">
    <img class="login-logo" src="assets/logo.png" alt="Logo"
         onerror="this.src='../assets/logo.png'; this.onerror=function(){this.style.display='none';};">
    <p class="login-company">VO Recovery Manager</p>
    <p class="login-software">Multi-Jeweller Edition</p>

    <h2><i class="fa-solid fa-store"></i> Register Company</h2>
    <p style="font-size:13px;color:#64748b;margin:0 0 8px;">New jewellery shop register કરો</p>

    <div class="section-title">Company Details</div>

    <label>Company / Shop Name *</label>
    <input type="text" id="companyName" placeholder="e.g. Shree Jewellers" required>

    <div class="form-row">
        <div>
            <label>Shop Code *</label>
            <input type="text" id="shopCode" placeholder="e.g. SJ" maxlength="10" required>
            <p class="hint">Short unique code (2–10 letters)</p>
        </div>
        <div>
            <label>Contact Number</label>
            <input type="text" id="contact" placeholder="9876543210">
        </div>
    </div>

    <label>Email</label>
    <input type="email" id="email" placeholder="info@company.com">

    <label>Address</label>
    <textarea id="address" rows="2" placeholder="City, State"></textarea>

    <div class="section-title">Admin Account</div>

    <label>Admin Full Name</label>
    <input type="text" id="adminName" placeholder="Owner / Manager name">

    <div class="form-row">
        <div>
            <label>Admin Username *</label>
            <input type="text" id="adminUsername" placeholder="e.g. sj_admin" required>
        </div>
        <div>
            <label>Admin Password *</label>
            <input type="password" id="adminPassword" placeholder="Min 4 characters" required>
        </div>
    </div>

    <label>Confirm Password *</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter password">

    <button class="btn-login" id="btnRegister" onclick="registerCompany()">
        <i class="fa-solid fa-check"></i> Register Company
    </button>
    <button class="btn-secondary" type="button" onclick="window.location.href='login.html'">
        ← Back to Login
    </button>

    <p id="msgBox"></p>
    <p class="login-footer">Powered by BK Design Hub</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-db.js"></script>

<script>
function showMsg(text, ok) {
    const box = document.getElementById("msgBox");
    box.className = ok ? "msg-ok" : "msg-err";
    box.innerText = text;
}

async function registerCompany() {
    const companyName = document.getElementById("companyName").value.trim();
    const code = document.getElementById("shopCode").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    const adminName = document.getElementById("adminName").value.trim();
    const adminUsername = document.getElementById("adminUsername").value.trim();
    const adminPassword = document.getElementById("adminPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if (!companyName) { showMsg("Company name required", false); return; }
    if (!code || code.length < 2) { showMsg("Shop code min 2 characters", false); return; }
    if (!adminUsername) { showMsg("Admin username required", false); return; }
    if (!adminPassword || adminPassword.length < 4) { showMsg("Password min 4 characters", false); return; }
    if (adminPassword !== confirmPassword) { showMsg("Passwords do not match", false); return; }

    const btn = document.getElementById("btnRegister");
    btn.disabled = true;
    btn.innerHTML = "Registering...";

    try {
        const result = await sbRegisterShop({
            companyName,
            code,
            contact,
            email,
            address,
            adminUsername,
            adminPassword,
            adminName: adminName || adminUsername
        });

        showMsg(
            "✅ Company registered successfully!\n\n" +
            "Shop: " + result.shop.name + "\n" +
            "Code: " + result.shop.code + "\n" +
            "Admin: " + result.user.username + "\n\n" +
            "Redirecting to Login...",
            true
        );

        setTimeout(function () {
            window.location.href = "login.html";
        }, 2200);
    } catch (e) {
        console.error(e);
        showMsg("Registration failed: " + (e.message || e), false);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Register Company';
    }
}
</script>
</body>
</html>
