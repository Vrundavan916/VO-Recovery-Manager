<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6762">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | BK Recovery Manager</title>
<link rel="stylesheet" href="css/style.css?v=bk3">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
body.login-body{
    margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:radial-gradient(ellipse at 20% 20%,rgba(63,167,157,0.15) 0%,transparent 50%),
        radial-gradient(ellipse at 80% 80%,rgba(31,103,98,0.2) 0%,transparent 50%),
        linear-gradient(145deg,#0A1F1D 0%,#14403D 40%,#16211F 100%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:20px;
}
.login-card{
    width:100%;max-width:420px;background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);
    border-radius:24px;padding:40px 36px 32px;
    box-shadow:0 25px 60px rgba(0,0,0,.4),0 0 0 1px rgba(63,167,157,0.2);
    text-align:center;animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.login-logo{width:88px;height:88px;object-fit:contain;margin:0 auto 14px;border-radius:18px;
    background:linear-gradient(135deg,#E6EFEE,#f8fafc);padding:10px;border:1px solid rgba(63,167,157,0.35);
    box-shadow:0 8px 24px rgba(63,167,157,0.15)}
.login-company{font-size:17px;font-weight:700;color:#16211F;margin:0 0 4px}
.login-software{font-size:13px;color:#64748b;margin:0 0 24px}
.login-card h2{margin:0 0 20px;color:#0E4D4B;font-size:22px;font-weight:700}
.login-card h2 i{color:#3FA79D;margin-right:6px}
.login-card label{display:block;text-align:left;font-weight:600;color:#334155;margin:14px 0 6px;font-size:13px}
.login-card input[type="text"],.login-card input[type="password"]{
    width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;
    box-sizing:border-box;outline:none;transition:.25s;background:#f8fafc}
.login-card input:focus{border-color:#3FA79D;background:#fff;box-shadow:0 0 0 4px rgba(63,167,157,.12)}
.remember-row{display:flex;align-items:center;gap:8px;margin-top:14px;text-align:left}
.remember-row input{width:auto;accent-color:#1F6762}
.remember-row label{margin:0;font-weight:500;color:#64748b;font-size:13px;cursor:pointer}
.btn-login{width:100%;margin-top:22px;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#0E4D4B,#1F6762);color:#fff;font-size:16px;font-weight:600;
    cursor:pointer;transition:.3s;box-shadow:0 8px 20px rgba(31,103,98,.3)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,103,98,.4)}
.btn-login:disabled{opacity:.7;cursor:wait;transform:none}
.btn-forgot{margin-top:16px;background:none;border:none;color:#1F6762;font-size:13px;cursor:pointer;font-weight:500}
.btn-forgot:hover{text-decoration:underline}
.login-footer{margin-top:22px;font-size:12px;color:#94a3b8}
.login-footer span{color:#3FA79D;font-weight:600}
.forgot-modal{display:none;position:fixed;inset:0;background:rgba(22,33,31,.6);z-index:9999;
    align-items:center;justify-content:center;padding:20px}
.forgot-modal.show{display:flex}
.forgot-box{background:#fff;border-radius:18px;padding:28px;max-width:400px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.3)}
.forgot-box h3{margin:0 0 8px;color:#16211F}
.forgot-box p{color:#64748b;font-size:13px;margin:0 0 16px}
.forgot-box input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:12px;box-sizing:border-box}
.forgot-actions{display:flex;gap:10px;margin-top:8px}
.forgot-actions button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.forgot-actions .btn-primary{background:#1F6762;color:#fff}
.forgot-actions .btn-secondary{background:#f1f5f9;color:#334155}
</style>
</head>
<body class="login-body">

<div class="login-card">
    <img id="companyLogo" class="login-logo" src="assets/logo.png" alt="Logo"
         onerror="this.src='../assets/logo.png';this.onerror=function(){this.style.display='none'};">
    <p class="login-company">BK Recovery Manager</p>
    <p class="login-software">BK Recovery Manager · Multi-Tenant SaaS</p>
    <h2><i class="fa-solid fa-gem"></i> Sign In</h2>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"
           onkeypress="if(event.key==='Enter'){login();}">
    <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me on this device</label>
    </div>
    <button class="btn-login" id="loginBtn" type="button" onclick="login()">
        <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
    <button class="btn-forgot" type="button" onclick="openForgotPassword()">
        <i class="fa-solid fa-key"></i> Forgot Password?
    </button>
    <p class="login-footer">Powered by <span>BK Design Hub</span> · Commercial Edition</p>
</div>

<div class="forgot-modal" id="forgotModal">
    <div class="forgot-box">
        <h3><i class="fa-solid fa-key"></i> Forgot Password</h3>
        <p>Enter your username. Super Admin or Shop Admin can reset the password from Settings / Company Management.</p>
        <input type="text" id="forgotUsername" placeholder="Username">
        <div class="forgot-actions">
            <button type="button" class="btn-secondary" onclick="closeForgotPassword()">Cancel</button>
            <button type="button" class="btn-primary" onclick="submitForgotPassword()">Submit</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("forgotModal").addEventListener("click",function(e){
    if(e.target===this) closeForgotPassword();
});
function openForgotPassword(){ document.getElementById("forgotModal").classList.add("show"); }
function closeForgotPassword(){ document.getElementById("forgotModal").classList.remove("show"); }
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
