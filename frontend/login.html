<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VO Recovery Manager - Login</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2563eb,#1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    text-align:center;
}

.login-box h1{
    margin-bottom:10px;
    color:#2563eb;
}

.login-box p{
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:20px;
    font-size:13px;
    color:#888;
}
</style>

</head>

<body>

<div class="login-box">

<h1>VO Recovery Manager</h1>

<p>Vrundavan Ornaments Pvt. Ltd.</p>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password" onkeypress="if(event.key==='Enter'){login();}">

<button onclick="login()">LOGIN</button>

<button type="button" onclick="resetLogin()" style="margin-top:10px;background:#64748b;font-size:14px;">
Reset Login (admin / 1234)
</button>

<p class="footer">
Powered by BK Design Hub
</p>

<p id="debugBox" style="color:red;font-size:12px;white-space:pre-wrap;text-align:left;"></p>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-db.js"></script>

<script>

window.onerror = function(msg, url, line){
    const box = document.getElementById("debugBox");
    if (box) box.innerText = "JS Error: " + msg + " (line " + line + ")";
};

function ensureDefaultAdmin(users){
    if (!Array.isArray(users)) users = [];
    const hasAdmin = users.some(u => u.username === "admin");
    if (!hasAdmin) {
        users.push({ username: "admin", password: "1234", role: "Admin" });
    }
    if (users.length === 0) {
        users = [{ username: "admin", password: "1234", role: "Admin" }];
    }
    localStorage.setItem("users", JSON.stringify(users));
    return users;
}

function getUsersLocal(){
    let users = JSON.parse(localStorage.getItem("users"));
    if (!users || !Array.isArray(users) || users.length === 0) {
        const oldCreds = JSON.parse(localStorage.getItem("credentials"));
        if (oldCreds && oldCreds.username) {
            users = [{ username: oldCreds.username, password: oldCreds.password, role: "Admin" }];
        } else {
            users = [{ username: "admin", password: "1234", role: "Admin" }];
        }
        localStorage.setItem("users", JSON.stringify(users));
    }
    return ensureDefaultAdmin(users);
}

async function login(){

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
        alert("Username અને Password નાખો");
        return;
    }

    // Init Firebase (optional)
    try {
        if (typeof initFirebase === "function") initFirebase();
    } catch (e) {
        console.error(e);
    }

    // 1) Local users first
    let users = getUsersLocal();

    // 2) Try merge Firebase users (do NOT wipe local if cloud empty/fails)
    try {
        if (typeof isFirebaseConfigured === "function" && isFirebaseConfigured() && typeof loadUsersFromFirebase === "function") {
            if (typeof initFirebase === "function") initFirebase();
            const cloudUsers = await loadUsersFromFirebase();
            if (cloudUsers && cloudUsers.length > 0) {
                // Merge by username (cloud overrides same username)
                const map = {};
                users.forEach(u => { map[u.username] = u; });
                cloudUsers.forEach(u => { map[u.username] = u; });
                users = Object.values(map);
                users = ensureDefaultAdmin(users);
                localStorage.setItem("users", JSON.stringify(users));
            }
        }
    } catch (e) {
        console.error("Firebase users load failed, using local", e);
    }

    const matched = users.find(u => u.username === username && u.password === password);

    if (matched) {
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("currentUser", matched.username);
        localStorage.setItem("currentRole", matched.role || "Admin");
        window.location.href = "dashboard.html";
    } else {
        const names = users.map(u => u.username).join(", ");
        alert("Invalid Username or Password\n\nAvailable users: " + (names || "none") + "\n\nReset માટે નીચે Reset Login દબાવો.");
    }

}

function resetLogin(){
    if (!confirm("Login reset કરશો?\n\nUsername: admin\nPassword: 1234")) return;

    const users = [{ username: "admin", password: "1234", role: "Admin" }];
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.removeItem("credentials");
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("currentUser");
    localStorage.removeItem("currentRole");

    // Also push to Firebase if available
    try {
        if (typeof initFirebase === "function") initFirebase();
        if (typeof syncUsersToFirebase === "function") {
            syncUsersToFirebase(users);
        }
    } catch (e) {
        console.error(e);
    }

    document.getElementById("username").value = "admin";
    document.getElementById("password").value = "1234";
    alert("Reset થયું!\n\nUsername: admin\nPassword: 1234\n\nહવે LOGIN દબાવો.");
}

</script>

</body>
</html>
