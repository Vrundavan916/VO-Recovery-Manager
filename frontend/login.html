<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A3D63">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | BK Recovery Manager</title>
<link rel="stylesheet" href="css/style.css?v=enterprise3">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
body.login-body{
    margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,0.14) 0%,transparent 50%),
        radial-gradient(ellipse at 80% 80%,rgba(212,175,55,0.06) 0%,transparent 50%),
        linear-gradient(150deg,#0A0F1D 0%,#0B1220 55%,#0D1526 100%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:20px;
}
.login-card{
    width:100%;max-width:420px;background:#1A2233;backdrop-filter:blur(20px);
    border-radius:20px;padding:40px 36px 32px;border:1px solid rgba(212,175,55,.16);
    box-shadow:0 25px 60px rgba(0,0,0,.5),0 0 0 1px rgba(212,175,55,0.08);
    text-align:center;animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.login-logo{width:88px;height:88px;object-fit:contain;margin:0 auto 14px;border-radius:16px;
    background:#fff;padding:10px;border:1px solid rgba(212,175,55,0.35);
    box-shadow:0 8px 24px rgba(212,175,55,0.2)}
.login-company{font-size:17px;font-weight:700;color:#fff;margin:0 0 4px}
.login-software{font-size:13px;color:#9CA6B8;margin:0 0 24px}
.login-card h2{margin:0 0 20px;color:#fff;font-size:22px;font-weight:700}
.login-card h2 i{color:#D4AF37;margin-right:6px}
.login-card label{display:block;text-align:left;font-weight:600;color:#9CA6B8;margin:14px 0 6px;font-size:13px}
.login-card input[type="text"],.login-card input[type="password"]{
    width:100%;padding:13px 16px;border:1.5px solid rgba(255,255,255,.09);border-radius:12px;font-size:15px;
    box-sizing:border-box;outline:none;transition:.25s;background:rgba(255,255,255,.03);color:#fff}
.login-card input:focus{border-color:#D4AF37;background:rgba(255,255,255,.05);box-shadow:0 0 0 4px rgba(212,175,55,.18)}
.remember-row{display:flex;align-items:center;gap:8px;margin-top:14px;text-align:left}
.remember-row input{width:auto;accent-color:#D4AF37}
.remember-row label{margin:0;font-weight:500;color:#9CA6B8;font-size:13px;cursor:pointer}
.btn-login{width:100%;margin-top:22px;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#D4AF37,#B8912C);color:#0B1220;font-size:16px;font-weight:700;
    cursor:pointer;transition:.3s;box-shadow:0 10px 24px rgba(212,175,55,.32)}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(212,175,55,.45)}
.btn-login:disabled{opacity:.7;cursor:wait;transform:none}
.btn-forgot{margin-top:16px;background:none;border:none;color:#E8C766;font-size:13px;cursor:pointer;font-weight:500}
.btn-forgot:hover{text-decoration:underline}
.login-footer{margin-top:22px;font-size:12px;color:#6B7690}
.login-footer span{color:#E8C766;font-weight:600}
.forgot-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9999;
    align-items:center;justify-content:center;padding:20px}
.forgot-modal.show{display:flex}
.forgot-box{background:#fff;border:1px solid #D9E7F3;border-radius:18px;padding:28px;max-width:400px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
.forgot-box h3{margin:0 0 8px;color:#1A3D63}
.forgot-box p{color:#73879B;font-size:13px;margin:0 0 16px}
.forgot-box input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.1);border-radius:10px;margin-bottom:12px;box-sizing:border-box;background:rgba(255,255,255,.03);color:#fff}
.forgot-actions{display:flex;gap:10px;margin-top:8px}
.forgot-actions button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.forgot-actions .btn-primary{background:linear-gradient(135deg,#D4AF37,#B8912C);color:#0B1220}
.forgot-actions .btn-secondary{background:rgba(255,255,255,.06);color:#9CA6B8}
</style>
</head>
<body class="login-body">

<div class="login-card">
    <img id="companyLogo" class="login-logo" src="assets/logo.png" alt="Logo"
         onerror="this.src='../assets/logo.png';this.onerror=function(){this.style.display='none'};">
    <p class="login-company">BK Recovery Manager</p>
    <p class="login-software">BK Recovery Manager · Multi-Tenant SaaS</p>
    <h2><i class="fa-solid fa-gem"></i> Sign In</h2>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"
           onkeypress="if(event.key==='Enter'){login();}">
    <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me on this device</label>
    </div>
    <button class="btn-login" id="loginBtn" type="button" onclick="login()">
        <i class="fa-solid fa-right-to-bracket"></i> Login
    </button>
    <button class="btn-forgot" type="button" onclick="openForgotPassword()">
        <i class="fa-solid fa-key"></i> Forgot Password?
    </button>
    <p class="login-footer">Powered by <span>BK Design Hub</span> · Commercial Edition</p>
</div>

<div class="forgot-modal" id="forgotModal">
    <div class="forgot-box">
        <h3><i class="fa-solid fa-key"></i> Forgot Password</h3>
        <p>Verify username + recovery email, then set a new password.</p>
        <label style="display:block;text-align:left;margin-top:8px;">Username *</label>
        <input type="text" id="forgotUsername" placeholder="e.g. superadmin" autocomplete="username">
        <label style="display:block;text-align:left;margin-top:8px;">Recovery Email *</label>
        <input type="email" id="forgotEmail" placeholder="Registered recovery email">
        <label style="display:block;text-align:left;margin-top:8px;">New Password *</label>
        <input type="password" id="forgotNewPass" placeholder="Min 4 characters" autocomplete="new-password">
        <label style="display:block;text-align:left;margin-top:8px;">Confirm Password *</label>
        <input type="password" id="forgotConfirmPass" placeholder="Re-enter password" autocomplete="new-password">
        <div class="forgot-actions" style="margin-top:16px;display:flex;gap:10px;">
            <button type="button" class="btn-secondary" onclick="closeForgotPassword()">Cancel</button>
            <button type="button" class="btn-primary" onclick="submitForgotPassword()">Reset Password</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("forgotModal").addEventListener("click",function(e){
    if(e.target===this) closeForgotPassword();
});
/* open/close/submitForgotPassword → auth.js */
</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
