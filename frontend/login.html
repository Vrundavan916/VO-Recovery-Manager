<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | VO Recovery Manager</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
body.login-body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 45%,#2563eb 100%);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    padding:20px;
}
.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:36px 32px 28px;
    box-shadow:0 25px 50px rgba(0,0,0,.35);
    text-align:center;
}
.login-logo{
    width:90px;
    height:90px;
    object-fit:contain;
    margin:0 auto 12px;
    border-radius:16px;
    background:#f8fafc;
    padding:8px;
    border:1px solid #e2e8f0;
}
.login-company{
    font-size:18px;
    font-weight:700;
    color:#0f172a;
    margin:0 0 4px;
}
.login-software{
    font-size:13px;
    color:#64748b;
    margin:0 0 22px;
}
.login-card h2{
    margin:0 0 18px;
    color:#2563eb;
    font-size:22px;
}
.login-card label{
    display:block;
    text-align:left;
    font-weight:600;
    color:#334155;
    margin:12px 0 6px;
    font-size:14px;
}
.login-card input{
    width:100%;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
    outline:none;
}
.login-card input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}
.btn-login{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}
.btn-login:hover{ background:#1d4ed8; }
.btn-reset{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:none;
    border-radius:10px;
    background:#64748b;
    color:#fff;
    font-size:13px;
    cursor:pointer;
}
.btn-forgot{
    margin-top:12px;
    background:none;
    border:none;
    color:#2563eb;
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
}
.login-footer{
    margin-top:18px;
    font-size:12px;
    color:#94a3b8;
}
#debugBox{ color:#ef4444; font-size:12px; text-align:left; white-space:pre-wrap; margin-top:10px; }
</style>
</head>
<body class="login-body">

<div class="login-card">
    <img id="companyLogo" class="login-logo" src="assets/logo.png" alt="Company Logo"
         onerror="this.src='../assets/logo.png'; this.onerror=function(){this.style.display='none';};">
    <p class="login-company" id="companyNameText">Vrundavan Ornaments Pvt. Ltd.</p>
    <p class="login-software" id="softwareNameText">VO Recovery Manager</p>

    <h2><i class="fa-solid fa-lock"></i> Login</h2>

    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password"
           onkeypress="if(event.key==='Enter'){login();}">

    <button class="btn-login" onclick="login()">LOGIN</button>
    <button class="btn-reset" type="button" onclick="resetLogin()">Reset Login (admin / 1234)</button>
    <button class="btn-forgot" type="button" onclick="forgotPassword()">Forgot / Change Password</button>

    <p style="margin-top:16px;font-size:13px;color:#64748b;">
        New jewellery shop?
        <a href="register.html" style="color:#2563eb;font-weight:600;text-decoration:none;">Register Company</a>
    </p>

    <p class="login-footer">Powered by BK Design Hub · Multi-Jeweller Edition</p>
    <p id="debugBox"></p>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-db.js"></script>
<script src="js/script.js"></script>

<script>
window.onerror = function(msg, url, line){
    const box = document.getElementById("debugBox");
    if (box) box.innerText = "JS Error: " + msg + " (line " + line + ")";
};

// Optional: show default branding (no localStorage)
(function loadBranding(){
    try {
        // defaults already in HTML; can enhance later from settings
    } catch(e){}
})();

function resetLogin(){
    if (!confirm("Reset form to default credentials hint?\n\nDefault logins:\nsuperadmin / 1234\nadmin / 1234\nrj_admin / 1234\ngp_admin / 1234")) return;
    document.getElementById("username").value = "admin";
    document.getElementById("password").value = "1234";
    alert("Form reset.\n\nUse:\n• superadmin / 1234  (all shops)\n• admin / 1234  (Vrundavan)\n• rj_admin / 1234  (Raj Jewellers)\n• gp_admin / 1234  (Golden Palace)");
}

async function forgotPassword(){
    alert("Password change is available after login in Settings page.\n\nDefault Super Admin: superadmin / 1234\nContact Super Admin to reset other accounts.");
}

// Override login button text reference if needed
</script>
</body>
</html>
